# 可选基础设施与安全（未引入对应依赖时不会生效）
hei:
  ddd:
    # Druid 数据源约定开关
    datasource:
      enabled: true
    # MyBatis-Plus：分页、元数据填充
    mybatis:
      enabled: true
    # Redis：RedisTemplate 序列化约定
    redis:
      enabled: true
    # CORS 跨域
    cors:
      enabled: true
      # 允许的来源（* 或具体域名，如 http://localhost:5173）
      allowed-origins:
        - "*"
      # 允许的请求头
      allowed-headers:
        - "*"
      # 允许的方法
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      # 是否允许携带 Cookie（为 true 时不要用 * 作精确 origin，已自动改用 pattern）
      allow-credentials: false
      # 预检缓存秒数
      max-age: 3600
    # 自实现 JWT 登录校验（配合 @RequireLogin）
    jwt:
      enabled: true
      # HMAC 密钥，长度建议 >= 32 字节，生产务必更换
      secret: hei-ddd-lite-jwt-secret-change-me-32bytes!!
      # Token 过期秒数（默认 2 小时）
      expire-seconds: 7200
      # 请求头名称
      header: Authorization
      # Token 前缀（注意末尾空格）
      token-prefix: "Bearer "
      # 签发者
      issuer: hei-ddd-lite
    # MinIO 对象存储
    minio:
      enabled: true
      endpoint: http://127.0.0.1:9000
      access-key: minioadmin
      secret-key: minioadmin
      bucket: hei
      create-bucket-if-absent: false

# 日志（按需调整）
# logging:
